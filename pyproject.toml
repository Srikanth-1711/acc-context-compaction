[project]
name = "acc"
version = "0.1.0"
description = "Automatically Context Compaction framework"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "typer",
    "fastapi",
    "sqlmodel",
    "alembic",
    "pydantic-settings",
    "httpx",
    "tiktoken",
    "pyyaml",
    "astor",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
acc-mcp = "acc.mcp.server:main"
acc-proxy = "acc.compaction.proxy:app"

[tool.setuptools.packages.find]
include = ["acc*"]
