[project]
name = "acc-context-compaction"
version = "0.3.0"
description = "ACC — Inline Reversible Compression for AI Agents"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp",
    "typer",
    "sqlmodel",
    "tiktoken",
    "tomli",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
acc-mcp = "acc.mcp_server:main"
acc = "acc.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=acc --cov-report=term-missing --cov-fail-under=80"

[tool.setuptools.packages.find]
include = ["acc*"]

[tool.coverage.run]
source = ["acc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]