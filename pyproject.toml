[project]
name = "acc-context-compaction"
version = "0.1.0"
description = "Automatically Context Compaction framework"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "typer",
    "fastapi",
    "sqlmodel",
    "alembic",
    "pydantic-settings",
    "httpx",
    "tiktoken",
    "pyyaml",
]

[project.optional-dependencies]
slicer = [
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
acc-mcp = "acc.cli.main:main"
acc-proxy = "acc.cli.proxy:main"

[tool.setuptools.packages.find]
include = ["acc*"]
