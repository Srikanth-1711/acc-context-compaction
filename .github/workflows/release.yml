name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: acc-mcp-linux-x64
          - os: macos-latest
            artifact_name: acc-mcp-macos-arm64
          - os: macos-13 # x64 mac
            artifact_name: acc-mcp-macos-x64
          - os: windows-latest
            artifact_name: acc-mcp-windows-x64.exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .[slicer]
          
      - name: Build binary
        run: python build_binary.py
        
      - name: Rename artifact
        run: |
          mv dist/acc-mcp dist/${{ matrix.artifact_name }} || mv dist/acc-mcp.exe dist/${{ matrix.artifact_name }}
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
